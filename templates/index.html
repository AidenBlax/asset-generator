<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant HD Asset Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <header class="border-b border-slate-800 p-6 text-center">
        <h1 class="text-3xl font-extrabold text-sky-400">⚡ AutoAsset Studio</h1>
        <p class="text-slate-400 text-sm mt-1">Generate HD thumbnails & overlays in seconds.</p>
    </header>

    <main class="flex-1 max-w-5xl mx-auto w-full p-6 grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
            <h2 class="text-xl font-bold text-white mb-2">1. Customize Template</h2>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Main Title</label>
                <input type="text" id="assetTitle" value="EPIC GAMEPLAY" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Subtitle</label>
                <input type="text" id="assetSubtitle" value="Road to Champion Rank #1" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Background Color</label>
                <input type="color" id="assetColor" value="#1e293b" class="h-10 w-20 bg-transparent cursor-pointer rounded">
            </div>
            <button onclick="generatePreview()" id="genBtn" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-lg">
                Generate Instant Preview
            </button>
        </div>

        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center space-y-4">
            <h2 class="text-xl font-bold text-white mb-2">2. Watermarked Preview</h2>
            <div id="previewBox" class="bg-slate-900 aspect-video rounded-lg border border-slate-700 flex items-center justify-center overflow-hidden">
                <span id="placeholderText" class="text-slate-500 text-sm">Click 'Generate' to build preview</span>
                <img id="previewImg" class="w-full h-full object-cover hidden" alt="Preview">
            </div>
            <div id="actionArea" class="hidden space-y-2">
                <a id="payLink" href="#" target="_blank" class="block w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg">
                    🔓 Unlock Clean HD Asset ($2.99)
                </a>
            </div>
        </div>
    </main>

    <script>
        async function generatePreview() {
            const btn = document.getElementById('genBtn');
            const title = document.getElementById('assetTitle').value;
            const subtitle = document.getElementById('assetSubtitle').value;
            const color = document.getElementById('assetColor').value;
            const previewImg = document.getElementById('previewImg');
            const placeholder = document.getElementById('placeholderText');
            const actionArea = document.getElementById('actionArea');
            const payLink = document.getElementById('payLink');

            btn.innerText = "Generating...";
            btn.disabled = true;

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, subtitle, color })
                });

                const result = await response.json();
                if (result.success) {
                    previewImg.src = result.preview_url + '?t=' + new Date().getTime();
                    previewImg.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    payLink.href = result.payment_url;
                    actionArea.classList.remove('hidden');
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (err) {
                alert('Server error.');
            } finally {
                btn.innerText = "Generate Instant Preview";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
